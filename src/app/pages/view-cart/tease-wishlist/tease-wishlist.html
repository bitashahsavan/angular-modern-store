<div appViewPanel class="flex items-center justify-between">
<div class="flex items-center gap-3" >
    <mat-icon class="!text-red-500">favorite</mat-icon>
    <div>
        <h2  class="text-xl font-bold">{{ store.wishlistCount()}}</h2>
        <p class="text-gray-500 text-sm"> You have {{store.wishlistCount()}} items saved for later</p>
    </div>
</div>

<div class="flex items-center gap-3">
    <button matButton routerLink="/wishlist">View All</button>
    <button matButton="filled" class="flex items-center gap-3 " (click)=" store.addAllWishlistCart()">
        <mat-icon>shoping_cart</mat-icon>
        Add All to Cart
    </button>
</div>
</div>
