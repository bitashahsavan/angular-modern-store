<div class="mx-auto max-w-[1200px] py-6 px-4">
  <app-back-button class="mb-6" navigateTo="/products/all">Continue Shopping</app-back-button>

  <h1 class="text-2xl font-bold text-gray-900 mb-6">My Wishlist</h1>

  @if (store.wishlistCount() === 0) {
    <p class="text-gray-600">You have no items in your wishlist.</p>
  } @else {
    <p class="text-gray-600 mb-6">{{ store.wishlistCount() }} items in your wishlist</p>

    <div class="responsive-grid">
      @for (product of store.wishlistItem(); track product.id) {
        <app-product-card [product]="product">
          <button
            mat-icon-button
            class="!absolute top-3 right-3 z-10 !w-10 !h-10 rounded-full !bg-white shadow-md"
            (click)="store.removeFromWishList(product.id)"
          >
            <mat-icon matButton="filled">delete</mat-icon>
          </button>
        </app-product-card>
      }
    </div>

    <div class="mt-8 flex justify-center ">
          <button matButton="outlined" class="danger" (click)="store.clearWishList()">Clear Wishlist</button>
        </div>
  }
</div>
