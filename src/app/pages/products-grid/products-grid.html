<mat-sidenav-container>
  <mat-sidenav class="w-64 sticky top-0 h-full" mode="side" [opened]="true">
    <div class="p-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Categories</h2>
      <mat-nav-list>
        @for (cat of categories(); track cat) {
          <mat-list-item
            [activated]="cat === category()"
            class="my-2"
            [routerLink]="['/products', cat]"
          >
            <span matListItemTitle class="font-medium" [class.text-white]="cat === category()">
              {{ cat }}
            </span>
          </mat-list-item>
        }
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="p-6 bg-gray-100 h-full">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">
      {{ category() || 'All Products' }}
    </h1>
    <p class="text-base text-gray-600 mb-6">
      {{ store.filteredProducts().length }} products in the
      {{ category() || 'All Products' }} category.
    </p>

    <div class="responsive-grid">
      @for (product of store.filteredProducts(); track product.id) {
        <app-product-card [product]="product">
          <app-toggle-wishlist-button [product]="product" />
        
        </app-product-card>
      }
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
